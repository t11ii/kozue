# Builds the desktop installers for macOS and Windows, plus the single-file web edition,
# and lets the app run its own smoke test on both systems.
# Run it from the Actions tab, or push a tag such as v0.1.0: a tag also puts the files
# into a draft release, to be looked over and published by hand.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/macos/Kozue.app
            app: src-tauri/target/universal-apple-darwin/release/bundle/macos/Kozue.app/Contents/MacOS/kozue
          - os: windows-latest
            name: windows
            rust-targets: ''
            args: ''
            bundle: ''
            app: src-tauri/target/release/kozue.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tauri build ${{ matrix.args }}
      # Without a signature that covers the whole app, a downloaded copy is refused as "damaged".
      - name: Check the signature
        if: matrix.bundle != ''
        run: codesign --verify --deep --strict --verbose=2 "${{ matrix.bundle }}"
      # The app edits, saves, loads, draws and exports in the real web view, then quits (src/selftest.ts).
      - name: Smoke test
        shell: bash
        timeout-minutes: 5
        run: |
          export KOZUE_SELFTEST="$RUNNER_TEMP/selftest"
          mkdir -p "$KOZUE_SELFTEST"
          code=0
          "${{ matrix.app }}" || code=$?
          cat "$KOZUE_SELFTEST/report.json" || true
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: kozue-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:html
      - uses: actions/upload-artifact@v4
        with:
          name: kozue-html
          if-no-files-found: error
          path: standalone/Kozue.html

  # A tag puts what was built into a draft release. Publishing it stays a decision made by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft a release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f | sort
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Kozue ${GITHUB_REF_NAME#v}" --notes "" \
            $(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.html' \) | sort)
